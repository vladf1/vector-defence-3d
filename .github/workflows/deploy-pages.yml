name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # rustup reads the channel, components and targets from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      # The CLI must match the wasm-bindgen crate pin in Cargo.toml.
      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-bindgen-cli
        if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --bin wasm-bindgen

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Served from the repository path (no custom domain), so build with its base.
      - name: Build Pages site
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
