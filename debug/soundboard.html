<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Vector Defence Soundboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10151c;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(50, 127, 116, 0.22), transparent 30rem),
          linear-gradient(135deg, #111820 0%, #20262d 48%, #171b21 100%);
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 40px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }

      button {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 70px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        color: #f9fbff;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
        cursor: pointer;
        font: inherit;
        text-align: left;
      }

      button:hover {
        border-color: rgba(94, 216, 186, 0.55);
        background: rgba(94, 216, 186, 0.16);
      }

      button:focus-visible {
        outline: 3px solid rgba(94, 216, 186, 0.72);
        outline-offset: 2px;
      }

      button.playing {
        border-color: rgba(255, 212, 94, 0.72);
        background: rgba(255, 212, 94, 0.18);
      }

      .label {
        overflow-wrap: anywhere;
        font-size: 1.03rem;
        font-weight: 800;
      }

      .play-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        color: #10151c;
        background: #5ed8ba;
        font-size: 0.9rem;
        font-weight: 900;
      }

      .status {
        min-height: 1.4em;
        margin-top: 18px;
        color: rgba(244, 247, 251, 0.75);
        font-weight: 700;
      }

      audio {
        display: none;
      }

      .debug-home {
        color: #9dffd7;
        font-weight: 800;
        text-decoration: none;
      }

    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Soundboard</h1>
        <a class="debug-home" href="./index.html">Debug tools</a>
      </header>

      <section class="board" aria-label="Game sound effects"></section>

      <p class="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
      import { AudioCue } from "/src/audio-manifest.ts";

      const board = document.querySelector(".board");
      const status = document.querySelector(".status");
      const audioVersion = Date.now().toString(36);
      let activeButton;

      const soundEntries = Object.values(AudioCue).map((cue) => {
        const sourceUrl = new URL(cue.url, document.baseURI);
        sourceUrl.searchParams.set("v", audioVersion);
        const audio = document.createElement("audio");
        const button = document.createElement("button");
        const label = document.createElement("span");
        const icon = document.createElement("span");

        audio.id = cue.id;
        audio.preload = "auto";
        audio.src = sourceUrl.href;
        button.type = "button";
        button.dataset.audioId = cue.id;
        label.className = "label";
        label.textContent = cue.label;
        icon.className = "play-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "▶";

        button.append(label, icon);
        board.append(button);
        document.body.append(audio);

        audio.addEventListener("ended", resetActiveButton);
        audio.addEventListener("error", () => {
          setStatus(`Could not load ${cue.label}.`);
          resetActiveButton();
        });

        button.addEventListener("click", async () => {
          resetActiveButton();
          for (const { audio: otherAudio } of soundEntries) {
            if (otherAudio !== audio) {
              otherAudio.pause();
              otherAudio.currentTime = 0;
            }
          }

          audio.currentTime = 0;
          activeButton = button;
          button.classList.add("playing");
          setStatus(`Playing ${cue.label}`);

          try {
            await audio.play();
          } catch {
            setStatus(`Browser blocked ${cue.label}. Try the button again.`);
            resetActiveButton();
          }
        });

        return { audio, button };
      });

      function setStatus(message) {
        status.textContent = message;
      }

      function resetActiveButton() {
        if (activeButton) {
          activeButton.classList.remove("playing");
          activeButton = undefined;
        }
      }
    </script>
  </body>
</html>
