<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Vector Defence Tower Sheet</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
        color: #effff7;
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #020807;
      }

      header {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px max(20px, calc((100vw - 1320px) / 2));
        border-bottom: 1px solid rgba(232, 255, 248, 0.12);
        background: rgba(2, 8, 7, 0.92);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0;
        color: #effff7;
        font-size: clamp(1.25rem, 4vw, 2rem);
      }

      a {
        color: #9dffd7;
        font-weight: 800;
        text-decoration: none;
      }

      main {
        padding: 24px;
      }

      .table-scroll {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        min-width: max-content;
        border: 1px solid rgba(232, 255, 248, 0.16);
      }

      th,
      td {
        border: 1px solid rgba(232, 255, 248, 0.16);
      }

      th {
        background: #07110f;
        color: rgba(239, 255, 247, 0.92);
        font-weight: 900;
      }

      thead th {
        height: 52px;
        padding: 0 16px;
        text-align: center;
      }

      tbody th {
        min-width: 160px;
        padding: 0 18px;
        text-align: right;
      }

      td {
        padding: 6px;
        background: #020807;
      }

      .preview-button {
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: zoom-in;
      }

      .preview-button:focus-visible {
        outline: 2px solid #9dffd7;
        outline-offset: -2px;
      }

      td canvas {
        display: block;
        width: 128px;
        height: 128px;
      }

      .sheet-status {
        margin: 0 0 16px;
        overflow: hidden;
        color: rgba(232, 255, 248, 0.7);
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* The WebGPU board renderer draws each cell here; captures are copied into the table. */
      .render-surface {
        position: fixed;
        left: -10000px;
        top: 0;
        pointer-events: none;
      }

      .render-surface canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .preview-dialog {
        width: min(100dvw, 100dvh);
        height: min(100dvw, 100dvh);
        max-width: none;
        max-height: none;
        margin: auto;
        padding: 0;
        overflow: hidden;
        border: 1px solid rgba(232, 255, 248, 0.16);
        background: #020807;
      }

      .preview-dialog::backdrop {
        background: rgba(0, 0, 0, 0.82);
      }

      .preview-dialog canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }

      .preview-dialog canvas:active {
        cursor: grabbing;
      }

      .preview-dialog-label,
      .preview-dialog-close {
        position: absolute;
        z-index: 1;
        top: 14px;
        border: 1px solid rgba(232, 255, 248, 0.2);
        background: rgba(2, 8, 7, 0.88);
        color: #effff7;
        font: inherit;
        font-weight: 900;
      }

      .preview-dialog-label {
        left: 14px;
        padding: 8px 12px;
        pointer-events: none;
      }

      .preview-dialog-close {
        right: 14px;
        width: 40px;
        height: 40px;
        padding: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tower + Projectile Sheet (3D)</h1>
      <a href="./index.html">Debug tools</a>
    </header>
    <main>
      <p id="tower-sheet-status" class="sheet-status" role="status">Rendering with the WebGPU board renderer…</p>
      <div class="table-scroll">
        <table id="tower-testing" aria-label="Tower and projectile render table"></table>
      </div>
    </main>
    <dialog id="tower-preview-dialog" class="preview-dialog" aria-labelledby="tower-preview-label">
      <span id="tower-preview-label" class="preview-dialog-label"></span>
      <button id="tower-preview-close" class="preview-dialog-close" type="button" aria-label="Close preview">×</button>
      <canvas id="tower-preview-canvas"></canvas>
    </dialog>
    <div id="tower-render-surface" class="render-surface" aria-hidden="true">
      <canvas id="tower-render-canvas"></canvas>
      <canvas id="tower-render-overlay"></canvas>
    </div>
    <script type="module" src="/src/tower-testing.ts"></script>
  </body>
</html>
