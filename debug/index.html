<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Vector Defence Debug Tools</title>
    <style>
      :root {
        color-scheme: dark;
        background: #020807;
        color: #effff7;
        font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 18% 0%, rgba(92, 255, 158, 0.12), transparent 34rem),
          linear-gradient(135deg, #020807 0%, #07100e 55%, #030605 100%);
      }

      main {
        width: min(1040px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 32px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 5rem);
        line-height: 0.92;
      }

      .game-link,
      .tool {
        color: inherit;
        text-decoration: none;
      }

      .game-link {
        color: rgba(157, 255, 215, 0.86);
        font-weight: 800;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .tool {
        display: grid;
        min-height: 160px;
        padding: 22px;
        border: 1px solid rgba(232, 255, 248, 0.16);
        border-radius: 10px;
        background: rgba(7, 20, 17, 0.72);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .tool:hover,
      .tool:focus-visible {
        border-color: rgba(157, 255, 215, 0.7);
        background: rgba(14, 40, 33, 0.82);
        outline: none;
      }

      .tool strong {
        align-self: end;
        color: #fff4bc;
        font-size: 1.45rem;
      }

      .tool span {
        margin-top: 8px;
        color: rgba(232, 255, 248, 0.66);
        line-height: 1.45;
      }

      @media (max-width: 640px) {
        header {
          align-items: start;
          flex-direction: column;
        }

        .tools {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Debug Tools</h1>
        <a class="game-link" href="../index.html">Back to game</a>
      </header>
      <nav class="tools" aria-label="Debug pages">
        <a class="tool" href="./towers.html">
          <strong>Tower Sheet</strong>
          <span>Every tower, projectile, and missile blast across levels 1–7, rendered by the real WebGPU board renderer.</span>
        </a>
        <a class="tool" href="./soundboard.html">
          <strong>Soundboard</strong>
          <span>Play every production game-audio cue from one page.</span>
        </a>
      </nav>
    </main>
  </body>
</html>
