[package]
name = "vd-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Browser entry point: the game, renderer, and camera controls exposed to the Svelte shell"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The scripted staging API (`window.__vectorDefence` in dev) and the debug pages' `TowerLab`.
# Production pages load the build without it; `npm run wasm` builds both.
labs = []

[dependencies]
vd-core.workspace = true
vd-render.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "GpuDevice", "Storage", "Window", "console"] }
